<form
  action="{% url 'crear_post_comunidad' %}"
  method="POST"
  enctype="multipart/form-data"
  class="publicar-caja"
  id="form-publicar-comunidad">
  
  {% csrf_token %}
  
  <input type="hidden" name="tipo_tarjeta" id="input-tipo-tarjeta" value="publicacion">

  <button type="button" id="btn-cerrar-modo" title="Volver a publicación normal" style="display: none;">
      <i class="fa-solid fa-xmark"></i>
  </button>

  <!-- BLOQUE SUPERIOR (Publicación Normal) -->
  <div class="publicar-top" id="bloque-publicar-normal">
    {% if request.user.perfil.foto_perfil %}
    <img src="{{ request.user.perfil.foto_perfil }}" alt="Tu Avatar" class="avatar-mini" />
    {% else %}
    <img src="https://via.placeholder.com/42" alt="Tu Avatar" class="avatar-mini" />
    {% endif %}

    <div class="publicar-input-wrap">
      <input
        type="text"
        name="texto"
        id="publicar-input-principal"
        placeholder="En qué serie estás pensando..."
        class="publicar-input"
      />

      <input
        type="file"
        name="imagen"
        id="input-archivo-oculto"
        accept="image/*"
        style="display: none;"
      />

      <button
        type="button"
        class="btn-foto"
        title="Subir foto"
        onclick="document.getElementById('input-archivo-oculto').click()"
      >
        <i class="fa-regular fa-image"></i>
      </button>
    </div>
  </div>

  <!-- CONTENEDOR VARIANTE: FORO -->
  <div id="variante-campos-foro" class="contenedor-animado-modo">
    <p class="foro-titulo-seccion">Nuevo Foro de Discusión</p>
    <div class="campo-foro-grupo">
      <input type="text" name="titulo_foro" id="input-titulo-foro" placeholder="Escribe el título de tu debate..." class="foro-control">
    </div>
    <div class="campo-foro-grupo campo-buscador-serie">
      <div class="buscador-serie-wrapper">
        <i class="fa-solid fa-magnifying-glass icono-buscador-foro"></i>
        <input type="text" id="buscador-serie-foro" placeholder="Busca la serie..." autocomplete="off">
      </div>
      <input type="hidden" name="serie_id" id="foro-serie-id-oculto" value="">
      <input type="hidden" name="serie_titulo_tmdb" id="foro-serie-titulo-tmdb" value="">
      <input type="hidden" name="serie_poster_tmdb" id="foro-serie-poster-tmdb" value="">
      <div id="resultados-series-flotante" style="display: none;"></div>
      <div id="serie-seleccionada-preview" style="display: none;">
        <img id="preview-serie-poster" src="" alt="Poster">
        <span id="preview-serie-titulo"></span>
        <button type="button" id="btn-remover-serie"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
    <div class="campo-foro-grupo">
      <textarea name="contexto_foro" id="textarea-contexto-foro" placeholder="Contexto del debate..." rows="4" class="foro-control"></textarea>
    </div>
  </div>

  <!-- CONTENEDOR VARIANTE: ENCUESTA -->
  <div id="variante-campos-encuesta" class="contenedor-animado-modo">
    <p class="foro-titulo-seccion">Crear Nueva Encuesta</p>
    <div class="campo-foro-grupo">
      <input type="text" name="titulo_encuesta" id="input-titulo-encuesta" placeholder="¿Cuál es la pregunta de tu encuesta?..." class="foro-control">
    </div>
    <div class="campo-foro-grupo">
      <textarea name="contexto_encuesta" id="textarea-contexto-encuesta" placeholder="Contexto explicativo..." rows="2" class="foro-control"></textarea>
    </div>
    <div id="contenedor-opciones-creacion">
      <div class="fila-opcion-input-dinamica" data-index="1">
        <div class="input-opcion-hibrida-wrapper">
          <i class="fa-solid fa-list-ul icono-opcion-decorativo"></i>
          <input type="text" name="opcion_texto_1" placeholder="Opción 1..." class="foro-control input-opcion-campo" autocomplete="off">
          <input type="hidden" name="opcion_serie_id_1" class="input-opcion-serie-id" value="">
        </div>
      </div>
      <div class="fila-opcion-input-dinamica" data-index="2">
        <div class="input-opcion-hibrida-wrapper">
          <i class="fa-solid fa-list-ul icono-opcion-decorativo"></i>
          <input type="text" name="opcion_texto_2" placeholder="Opción 2..." class="foro-control input-opcion-campo" autocomplete="off">
        </div>
      </div>
    </div>
  </div>

  <!-- BOTONES DE ACCIÓN INFERIORES -->
  <div class="publicar-acciones">
    <button type="button" class="accion-btn" data-modo="foro"><i class="fa-solid fa-fire"></i> Foro</button>
    <button type="button" class="accion-btn activo" data-modo="serie"><i class="fa-solid fa-tv"></i> Serie</button>
    <button type="button" class="accion-btn" data-modo="encuesta"><i class="fa-solid fa-square-poll-horizontal"></i> Encuesta</button>
    <button type="button" class="accion-btn" data-modo="historia"><i class="fa-solid fa-book-open"></i> Historia</button>

    <button type="submit" class="publicar-submit">Publicar</button>
  </div>
</form>

<script>
  if (window.cajaPublicarInicializada) {
      console.warn("Script de publicación ya inicializado previamente.");
  } else {
      window.cajaPublicarInicializada = true;

      document.addEventListener("DOMContentLoaded", function () {
          const formCaja = document.getElementById("form-publicar-comunidad");
          const botonesAccion = document.querySelectorAll(".publicar-acciones .accion-btn");
          const bloqueNormal = document.getElementById("bloque-publicar-normal");
          const inputTipoTarjeta = document.getElementById("input-tipo-tarjeta");
          const btnCerrarModo = document.getElementById("btn-cerrar-modo");
          
          const varianteForo = document.getElementById("variante-campos-foro");
          const varianteEncuesta = document.getElementById("variante-campos-encuesta");

          function volverAModoNormal() {
              botonesAccion.forEach(b => b.classList.remove("activo"));
              const btnSerie = Array.from(botonesAccion).find(b => b.getAttribute("data-modo") === "serie");
              if (btnSerie) btnSerie.classList.add("activo");

              if (inputTipoTarjeta) inputTipoTarjeta.value = "publicacion";
              if (btnCerrarModo) btnCerrarModo.style.display = "none";

              if (varianteForo) varianteForo.classList.remove("abierto");
              if (varianteEncuesta) varianteEncuesta.classList.remove("abierto");

              setTimeout(() => {
                  if (bloqueNormal) {
                      bloqueNormal.style.opacity = "1";
                      bloqueNormal.style.visibility = "visible";
                      bloqueNormal.style.display = "flex";
                  }
              }, 150);
          }

          if (btnCerrarModo) {
              btnCerrarModo.addEventListener("click", volverAModoNormal);
          }

          botonesAccion.forEach(btn => {
              if (btn.hasAttribute("data-modo")) {
                  btn.addEventListener("click", function () {
                      const modo = this.getAttribute("data-modo");

                      if (modo === "serie" || modo === "historia") {
                          volverAModoNormal();
                          if (modo === "historia") {
                              if (inputTipoTarjeta) inputTipoTarjeta.value = "publicacion";
                              botonesAccion.forEach(b => b.classList.remove("activo"));
                              this.classList.add("activo");
                          }
                          return;
                      }

                      botonesAccion.forEach(b => b.classList.remove("activo"));
                      this.classList.add("activo");
                      if (inputTipoTarjeta) inputTipoTarjeta.value = modo;

                      if (bloqueNormal) {
                          bloqueNormal.style.opacity = "0";
                          bloqueNormal.style.visibility = "hidden";
                      }
                      
                      setTimeout(() => {
                          if (bloqueNormal) bloqueNormal.style.display = "none";
                          if (btnCerrarModo) btnCerrarModo.style.display = "block";
                          
                          if (modo === "foro") {
                              if (varianteEncuesta) varianteEncuesta.classList.remove("abierto");
                              if (varianteForo) varianteForo.classList.add("abierto");
                          } else if (modo === "encuesta") {
                              if (varianteForo) varianteForo.classList.remove("abierto");
                              if (varianteEncuesta) varianteEncuesta.classList.add("abierto");
                          }
                      }, 200);
                  });
              }
          });

          // Envío protegido y blindado con CSRF Token incluido
          if (formCaja) {
              let estaEnviando = false;

              formCaja.addEventListener("submit", function (event) {
                  event.preventDefault(); 

                  if (estaEnviando) return;
                  estaEnviando = true;

                  const submitBtn = formCaja.querySelector(".publicar-submit");
                  if (submitBtn) {
                      submitBtn.disabled = true;
                      submitBtn.textContent = "Publicando...";
                  }

                  const formData = new FormData(formCaja);
                  const csrfInput = formCaja.querySelector('[name=csrfmiddlewaretoken]');
                  const csrfToken = csrfInput ? csrfInput.value : '';

                  fetch(formCaja.action, {
                      method: "POST",
                      body: formData,
                      headers: { 
                          "X-Requested-With": "XMLHttpRequest",
                          "X-CSRFToken": csrfToken
                      },
                  })
                  .then(async (response) => {
                      if (response.ok) {
                          formCaja.reset();
                          volverAModoNormal();
                          window.location.reload(); 
                      } else {
                          const errorData = await response.text();
                          console.error("Error del servidor:", errorData);
                          alert("Hubo un error al procesar la publicación.");
                          estaEnviando = false;
                          if (submitBtn) {
                              submitBtn.disabled = false;
                              submitBtn.textContent = "Publicar";
                          }
                      }
                  })
                  .catch((error) => {
                      console.error("Error de red:", error);
                      estaEnviando = false;
                      if (submitBtn) {
                          submitBtn.disabled = false;
                          submitBtn.textContent = "Publicar";
                      }
                  });
              });
          }
      });
  }
</script>
